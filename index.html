<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zion的摄影记录 · Zion's Photography</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body class="locked">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📷</span>
      <div class="brand-text">
        <span class="brand-title" data-i18n="siteTitle">Zion的摄影记录</span>
        <span class="brand-sub" data-i18n="siteSub">Zion's Photography</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="lockBtn" class="ghost-btn lock-btn" data-i18n="lockBtn">🔒 编辑</button>
      <button id="langToggle" class="ghost-btn" data-i18n="langBtn">EN</button>
      <button id="importBtn" class="ghost-btn" data-i18n="importBtn">批量导入</button>
      <button id="addBtn" class="primary-btn" data-i18n="addPhoto">添加照片</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content">
      <section class="hero">
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-tagline" id="heroTagline"></p>
      </section>
      <section class="gallery-wrap">
        <div class="gallery" id="gallery"></div>
        <div class="empty-state" id="emptyState" hidden>
          <p class="empty-title" data-i18n="empty">这里还没有照片</p>
          <p class="empty-hint" data-i18n="emptyHint">点击右上角「添加照片」或「批量导入」开始记录</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Add Photo Modal -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 data-i18n="modalTitle">添加照片</h2>
        <button class="icon-btn" id="modalClose" aria-label="close">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span data-i18n="categoryLabel">分类</span>
          <select id="catSelect"></select>
        </label>
        <label class="field">
          <span data-i18n="imageLabel">选择照片</span>
          <input type="file" id="fileInput" accept="image/*" />
        </label>
        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="preview" />
        </div>
        <label class="field">
          <span data-i18n="capZhLabel">说明（中文）</span>
          <textarea id="capZh" rows="2"></textarea>
        </label>
        <label class="field">
          <span data-i18n="capEnLabel">说明（English）</span>
          <textarea id="capEn" rows="2"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" id="modalCancel" data-i18n="cancel">取消</button>
        <button class="primary-btn" id="saveBtn" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- Edit Caption Modal -->
  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 data-i18n="editTitle">编辑说明</h2>
        <button class="icon-btn" id="editClose" aria-label="close">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span data-i18n="categoryLabel">分类</span>
          <select id="editCatSelect"></select>
        </label>
        <label class="field">
          <span data-i18n="capZhLabel">说明（中文）</span>
          <textarea id="editCapZh" rows="2"></textarea>
        </label>
        <label class="field">
          <span data-i18n="capEnLabel">说明（English）</span>
          <textarea id="editCapEn" rows="2"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" id="editCancel" data-i18n="cancel">取消</button>
        <button class="primary-btn" id="editSave" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal-overlay" id="pwModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 data-i18n="unlockTitle">输入编辑密码</h2>
        <button class="icon-btn" id="pwClose" aria-label="close">×</button>
      </div>
      <div class="modal-body">
        <p class="pw-hint" data-i18n="unlockHint">只有你能添加、修改或删除照片。输入密码后本标签页内无需重复输入。</p>
        <label class="field">
          <span data-i18n="pwLabel">密码</span>
          <input type="password" id="pwInput" autocomplete="current-password" />
        </label>
        <p class="pw-error" id="pwError" hidden data-i18n="wrongPw">密码不对，再试一次</p>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" id="pwCancel" data-i18n="cancel">取消</button>
        <button class="primary-btn" id="pwOk" data-i18n="unlock">解锁</button>
      </div>
    </div>
  </div>

  <!-- Lightbox (double-click a photo to enlarge) -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="close">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="prev">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="next">›</button>
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="" />
    </div>
    <div class="lb-bar">
      <div class="lb-caption" id="lbCaption"></div>
      <div class="lb-count" id="lbCount"></div>
    </div>
  </div>

  <input type="file" id="importInput" accept=".zip" hidden />
  <div class="toast" id="toast" hidden></div>

  <script src="app.js?v=12"></script>
</body>
</html>
